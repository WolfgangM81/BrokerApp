# BrokerApp — Python workspace root.
#
# This file declares the uv workspace and project-wide Python tooling
# (ruff, mypy, pytest). It is intentionally *not* a Python package itself —
# real code lives in apps/api, services/*, and (later) ml/.

[tool.uv.workspace]
members = [
  "apps/api",
  "services/ingest",
  "services/forecast",
  "services/notifier",
]
# Note: ml/ is intentionally NOT a workspace member yet. It becomes one in
# Phase 3 when real modules land under ml/features, ml/models, ml/backtests.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  ".venv",
  "node_modules",
  "build",
  "dist",
  "mlruns",
  "**/migrations/versions",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "N",    # pep8-naming
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
  "ASYNC",# flake8-async
  "S",    # flake8-bandit
  "PL",   # pylint
  "TID",  # flake8-tidy-imports
]
ignore = [
  "E501",  # line length handled by formatter
  "S101",  # asserts in tests are fine
  "PLR0913", # too many arguments — pragmatic
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "PLR2004"]
"**/conftest.py" = ["S"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = [
  "build/",
  "dist/",
  ".venv/",
  "mlruns/",
]

[[tool.mypy.overrides]]
module = [
  "yfinance.*",
  "ccxt.*",
  "vectorbt.*",
  "talib.*",
  "darts.*",
  "shap.*",
  "exchange_calendars.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--showlocals",
]
asyncio_mode = "auto"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pkg_resources",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]
