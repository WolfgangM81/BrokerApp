# BrokerApp CI/CD pipeline.
#
# Stages:
#   lint    — ruff, mypy, eslint, prettier (fast feedback)
#   test    — pytest, vitest (unit tests)
#   build   — Docker images for api/web/worker, pushed to GitLab Container Registry
#   deploy  — helm upgrade against the homelab k8s cluster
#
# Rules:
#   - lint/test always run on MR + main
#   - build/deploy only on main (and tagged releases later)
#   - per-service jobs use rules:changes so we don't build everything on every commit
#
# Required CI variables (set in GitLab → Settings → CI/CD → Variables):
#   CI_REGISTRY_USER, CI_REGISTRY_PASSWORD, CI_REGISTRY_IMAGE   (auto-provided)
#   KUBE_CONFIG                  (base64-encoded kubeconfig for homelab cluster)
#   VAULT_ADDR, VAULT_TOKEN      (for Vault-sourced secrets — phase 4+)

stages:
  - lint
  - test
  - security
  - build
  - deploy

variables:
  PYTHON_IMAGE: "python:3.12-slim-bookworm"
  NODE_IMAGE: "node:22-alpine"
  KANIKO_IMAGE: "gcr.io/kaniko-project/executor:v1.23.2-debug"
  HELM_IMAGE: "alpine/helm:3.16.2"
  KUBECTL_IMAGE: "bitnami/kubectl:1.31.2"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PNPM_HOME: "$CI_PROJECT_DIR/.cache/pnpm"
  GIT_DEPTH: "20"

default:
  interruptible: true

# --- common rule fragments ---
.on-mr-or-main:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

.only-main:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================================================
# LINT
# ============================================================================

lint:python:
  stage: lint
  image: $PYTHON_IMAGE
  extends: .on-mr-or-main
  cache:
    key:
      files: [pyproject.toml]
    paths: [.cache/uv, .cache/pip]
  before_script:
    - pip install --root-user-action=ignore uv
    - uv venv
    - source .venv/bin/activate
    - uv pip install ruff mypy
  script:
    - ruff check .
    - ruff format --check .

lint:typescript:
  stage: lint
  image: $NODE_IMAGE
  extends: .on-mr-or-main
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.cache/pnpm]
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile || pnpm install
  script:
    - pnpm -r run lint
    - pnpm format:check

generate:api-client:
  # Re-render packages/api-client/src/schema.ts from the live OpenAPI spec
  # produced by the API and fail if the committed file drifts.
  stage: lint
  image: $NODE_IMAGE
  extends: .on-mr-or-main
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [apps/api/**/*, packages/api-client/**/*]
    - if: $CI_COMMIT_BRANCH == "main"
  services:
    - name: timescale/timescaledb:2.17.0-pg16
      alias: postgres
      command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
  variables:
    POSTGRES_USER: brokerapp
    POSTGRES_PASSWORD: brokerapp
    POSTGRES_DB: brokerapp
    DATABASE_URL: "postgresql+asyncpg://brokerapp:brokerapp@postgres:5432/brokerapp"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl
    - curl -fsSL https://astral.sh/uv/install.sh | sh
    - export PATH="/root/.local/bin:$PATH"
    - uv sync --all-extras
    - corepack enable
    - pnpm install --frozen-lockfile || pnpm install
  script:
    - uv run --package brokerapp-api python -c "from api.main import app; import json; open('apps/api/openapi.json','w').write(json.dumps(app.openapi(), indent=2))"
    - pnpm --filter @brokerapp/api-client generate
    - git diff --exit-code packages/api-client/src/schema.ts || (echo 'API client drift — regenerate locally: pnpm --filter @brokerapp/api-client generate'; exit 1)

lint:helm:
  stage: lint
  image: $HELM_IMAGE
  extends: .on-mr-or-main
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [infra/helm/**/*]
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - helm lint infra/helm/api
    - helm lint infra/helm/web
    - helm lint infra/helm/worker
    - helm lint infra/helm/forecast-worker
    - helm lint infra/helm/db
    - helm lint infra/helm/backup
    - helm dependency update infra/helm/umbrella
    - helm lint infra/helm/umbrella

validate:k8s:
  # Render the umbrella chart and validate every resulting manifest against
  # the upstream Kubernetes schemas. Catches malformed resources before deploy.
  stage: lint
  image: alpine:3.20
  extends: .on-mr-or-main
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [infra/helm/**/*]
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    HELM_VERSION: "3.16.2"
    KUBECONFORM_VERSION: "0.6.7"
    K8S_VERSION: "1.31.0"
  before_script:
    - apk add --no-cache curl tar
    - curl -fsSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" | tar xz -C /tmp
    - mv /tmp/linux-amd64/helm /usr/local/bin/helm
    - curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin
  script:
    - helm dependency update infra/helm/umbrella
    - helm template brokerapp infra/helm/umbrella --namespace brokerapp > rendered.yaml
    - kubeconform -strict -kubernetes-version "${K8S_VERSION}"
      -summary -verbose
      -schema-location default
      -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      rendered.yaml

# ============================================================================
# TEST
# ============================================================================

test:api:
  stage: test
  image: $PYTHON_IMAGE
  extends: .on-mr-or-main
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [apps/api/**/*, pyproject.toml]
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - pip install --root-user-action=ignore uv
    - uv venv
    - source .venv/bin/activate
    - uv pip install -e "apps/api[dev]"
  script:
    - cd apps/api
    - pytest -ra --cov=src/api --cov-report=term-missing --cov-report=xml
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/api/coverage.xml
    paths:
      - apps/api/coverage.xml
    expire_in: 1 week

test:ingest:
  stage: test
  image: $PYTHON_IMAGE
  extends: .on-mr-or-main
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [services/ingest/**/*, pyproject.toml]
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - pip install --root-user-action=ignore uv
    - uv venv
    - source .venv/bin/activate
    - uv pip install -e "services/ingest[dev]"
  script:
    - cd services/ingest
    - pytest -ra

test:web:
  stage: test
  image: $NODE_IMAGE
  extends: .on-mr-or-main
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [apps/web/**/*, packages/**/*, pnpm-lock.yaml]
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile || pnpm install
  script:
    - pnpm --filter @brokerapp/web run typecheck
    - pnpm --filter @brokerapp/web run test

test:integration:
  # Apply every Alembic migration against a real TimescaleDB service and
  # run the integration tests in services/db/tests. Catches schema /
  # hypertable / continuous-aggregate regressions before they reach the
  # cluster.
  stage: test
  image: $PYTHON_IMAGE
  extends: .on-mr-or-main
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [services/db/**/*, apps/api/**/*, ml/**/*]
    - if: $CI_COMMIT_BRANCH == "main"
  services:
    - name: timescale/timescaledb:2.17.0-pg16
      alias: postgres
      command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
  variables:
    POSTGRES_USER: brokerapp
    POSTGRES_PASSWORD: brokerapp
    POSTGRES_DB: brokerapp
    BROKERAPP_DB_INTEGRATION_URL: "postgresql+psycopg://brokerapp:brokerapp@postgres:5432/brokerapp"
  before_script:
    - pip install --root-user-action=ignore uv
    - uv venv
    - source .venv/bin/activate
    - uv pip install -e "services/db[sync,dev]"
  script:
    - pytest -ra services/db/tests

# ============================================================================
# SECURITY (lint-level gates, run on every MR + main)
# ============================================================================

lint:precommit:
  # Re-run all pre-commit hooks against the full tree so CI fails fast on
  # the same checks contributors should run locally.
  stage: lint
  image: python:3.12-slim-bookworm
  extends: .on-mr-or-main
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - pip install --root-user-action=ignore pre-commit
  script:
    - pre-commit run --all-files --show-diff-on-failure

security:sbom:
  # Generate a CycloneDX SBOM for Python + JS. Published as a CI artifact
  # so it can be diff'd between deploys / shipped to a vuln tracker.
  stage: security
  image: python:3.12-slim-bookworm
  extends: .on-mr-or-main
  before_script:
    - pip install --root-user-action=ignore cyclonedx-bom pip-licenses
    - apt-get update && apt-get install -y --no-install-recommends curl
    - curl -fsSL https://github.com/CycloneDX/cyclonedx-node-npm/releases/latest/download/cyclonedx-node-npm
        -o /usr/local/bin/cyclonedx-pnpm || true
  script:
    - mkdir -p sbom
    - cyclonedx-py environment --output sbom/python.cdx.json || true
    - corepack enable && pnpm install --frozen-lockfile || pnpm install
    - npx --yes @cyclonedx/cyclonedx-npm@latest --output-file sbom/js.cdx.json || true
  artifacts:
    paths: [sbom/]
    expire_in: 90 days

security:trivy-fs:
  # Filesystem scan for vulnerable deps and obvious secrets. Hard-fails
  # on HIGH/CRITICAL findings; ignores DEV-only deps via .trivyignore.
  stage: security
  image: aquasec/trivy:0.55.2
  extends: .on-mr-or-main
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL --no-progress
        --ignore-unfixed --skip-dirs node_modules,.venv .

security:trivy-images:
  # Scan the just-built images. Runs on main only because builds run on
  # main only.
  stage: security
  image: aquasec/trivy:0.55.2
  extends: .only-main
  needs:
    - job: build:api
      optional: true
    - job: build:migrate
      optional: true
    - job: build:worker
      optional: true
    - job: build:forecast
      optional: true
    - job: build:web
      optional: true
  script:
    - for img in api migrate worker forecast web; do
        echo "=== scanning $img ===" ;
        trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress
          --ignore-unfixed
          "$CI_REGISTRY_IMAGE/$img:$CI_COMMIT_SHORT_SHA" || exit 1 ;
      done

# ============================================================================
# BUILD (only on main; build all images via Kaniko)
# ============================================================================

.build-image:
  stage: build
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  extends: .only-main
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "$CI_REGISTRY": {
            "username": "$CI_REGISTRY_USER",
            "password": "$CI_REGISTRY_PASSWORD"
          }
        }
      }
      EOF

build:api:
  extends: .build-image
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: [apps/api/**/*, services/db/**/*, infra/docker/Dockerfile.api, pyproject.toml]
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/infra/docker/Dockerfile.api"
      --destination "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE/api:latest"

build:migrate:
  extends: .build-image
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: [services/db/**/*, infra/docker/Dockerfile.migrate, pyproject.toml]
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/infra/docker/Dockerfile.migrate"
      --destination "$CI_REGISTRY_IMAGE/migrate:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE/migrate:latest"

build:web:
  extends: .build-image
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: [apps/web/**/*, packages/**/*, infra/docker/Dockerfile.web, pnpm-lock.yaml]
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/infra/docker/Dockerfile.web"
      --destination "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE/web:latest"

build:worker:
  extends: .build-image
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        [services/ingest/**/*, services/db/**/*, infra/docker/Dockerfile.worker, pyproject.toml]
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/infra/docker/Dockerfile.worker"
      --destination "$CI_REGISTRY_IMAGE/worker:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE/worker:latest"

build:forecast:
  extends: .build-image
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - services/forecast/**/*
        - services/db/**/*
        - ml/**/*
        - infra/docker/Dockerfile.forecast
        - pyproject.toml
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/infra/docker/Dockerfile.forecast"
      --destination "$CI_REGISTRY_IMAGE/forecast:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE/forecast:latest"

# ============================================================================
# DEPLOY (only on main; helm upgrade)
# ============================================================================

deploy:k8s:
  stage: deploy
  image: $HELM_IMAGE
  extends: .only-main
  # All image-build jobs must succeed, but they're rules:changes-gated, so
  # missing artifacts on a docs-only commit don't block the deploy.
  needs:
    - job: build:api
      optional: true
    - job: build:migrate
      optional: true
    - job: build:web
      optional: true
    - job: build:worker
      optional: true
    - job: build:forecast
      optional: true
  before_script:
    - apk add --no-cache bash gettext
    - mkdir -p ~/.kube && echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
    - helm dependency update infra/helm/umbrella
  script:
    - helm upgrade --install brokerapp infra/helm/umbrella
      --namespace brokerapp
      --create-namespace
      --set api.image.tag=$CI_COMMIT_SHORT_SHA
      --set web.image.tag=$CI_COMMIT_SHORT_SHA
      --set worker.image.tag=$CI_COMMIT_SHORT_SHA
      --set forecastWorker.image.tag=$CI_COMMIT_SHORT_SHA
      --set db.migration.image.tag=$CI_COMMIT_SHORT_SHA
      --wait --timeout 10m
  environment:
    name: production
    url: https://brokerapp.orbiter
