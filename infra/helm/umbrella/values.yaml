# Umbrella overrides per sub-chart go under the matching alias. Real
# secrets land via the GitLab CI pipeline (Vault → CI variables → k8s
# Secret) — see ADR-0010 + .gitlab-ci.yml.

db:
  enabled: true
  storage:
    size: 50Gi

api:
  replicaCount: 2
  image:
    tag: "latest"
  serviceMonitor:
    enabled: true

web:
  replicaCount: 2
  image:
    tag: "latest"

worker:
  replicaCount: 2
  beat:
    enabled: true
  image:
    tag: "latest"

backup:
  enabled: true
