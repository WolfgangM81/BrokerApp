# See ADR-0010. The CronJobs run inside the cluster and write to MinIO via
# the in-cluster service. The age public key is mounted from the secret
# `brokerapp-backup-secrets` (key: `age.pub`).

schedule:
  backup: "30 1 * * *" # 01:30 UTC nightly, after EOD ingest
  restoreTest: "30 4 * * 0" # Sundays 04:30 UTC

backupImage: postgres:16-alpine
ageImage: ghcr.io/getsops/age:latest
mcImage: minio/mc:RELEASE.2024-10-08T09-37-26Z

minio:
  endpoint: http://minio.brokerapp.svc.cluster.local:9000
  bucket: backups
  prefix: postgres
  accessKeySecret: brokerapp-backup-secrets

retentionDays: 30

dbServiceName: brokerapp-db
dbSecret: brokerapp-db-secrets

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi
