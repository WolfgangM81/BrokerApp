[project]
name = "brokerapp-ml"
version = "0.1.0"
description = "BrokerApp ML — features, baseline models, walk-forward backtests"
requires-python = ">=3.12,<3.13"
dependencies = [
  # See ADR-0007: Polars-first, Pandas at library boundaries.
  "polars>=1.13.1",
  "pandas>=2.2.3",
  "numpy>=2.1.3",
  "scikit-learn>=1.5.2",
  "lightgbm>=4.5.0",
  "xgboost>=2.1.2",
  "statsmodels>=0.14.4",
  "mlflow>=2.17.2",
  "optuna>=4.0.0",
  # Technical-analysis indicators (see ADR-0007).
  "ta-lib>=0.5.1",
  "exchange-calendars>=4.5.6",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.3.1",
  "ipykernel>=6.29.5",
  "pytest>=8.3.3",
  "ruff>=0.7.4",
  "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brokerapp_ml"]
