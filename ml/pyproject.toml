[project]
name = "brokerapp-ml"
version = "0.1.0"
description = "BrokerApp ML research environment (notebooks, features, models, backtests)"
requires-python = ">=3.12,<3.13"
# Phase 0 has no Python source yet — this pyproject.toml only declares the
# environment ML researchers use locally. Once Phase 3 lands real modules
# under ml/features/, ml/models/, ml/backtests/ this will become a workspace
# member with proper packages.
dependencies = [
  # See ADR-0007: Polars-first, Pandas at library boundaries.
  "polars>=1.13.1",
  "pandas>=2.2.3",
  "numpy>=2.1.3",
  "scikit-learn>=1.5.2",
  "lightgbm>=4.5.0",
  "xgboost>=2.1.2",
  "statsmodels>=0.14.4",
  "mlflow>=2.17.2",
  "optuna>=4.0.0",
  # Technical-analysis indicators (see ADR-0007): TA-Lib (C library) for
  # speed and breadth. Requires libta-lib-dev on the build host.
  "ta-lib>=0.5.1",
  "exchange-calendars>=4.5.6",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.3.1",
  "ipykernel>=6.29.5",
  "pytest>=8.3.3",
  "ruff>=0.7.4",
  "mypy>=1.13.0",
]

# No build-system / packages yet — see comment above.
