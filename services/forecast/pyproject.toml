[project]
name = "brokerapp-forecast"
version = "0.1.0"
description = "BrokerApp forecast worker — training and inference for baseline models"
requires-python = ">=3.12,<3.13"
dependencies = [
  "brokerapp-db[sync]",
  "brokerapp-ml",
  "celery[redis]>=5.4.0",
  "redis>=5.2.0",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  "structlog>=24.4.0",
  "polars>=1.13.1",
  "pandas>=2.2.3",
  "mlflow>=2.17.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.7.4",
  "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast"]

[tool.uv.sources]
brokerapp-db = { workspace = true }
brokerapp-ml = { workspace = true }
