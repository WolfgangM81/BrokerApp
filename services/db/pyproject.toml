[project]
name = "brokerapp-db"
version = "0.1.0"
description = "BrokerApp shared SQLAlchemy models + Alembic migrations"
requires-python = ">=3.12,<3.13"
# Intentionally minimal: this package is imported by both the API (async)
# and the worker (sync), so it must not pull in FastAPI, Celery, or any
# data-source library. It only owns the DB schema.
dependencies = [
  "sqlalchemy>=2.0.36",
  "alembic>=1.13.3",
  "pydantic>=2.9.2",
]

[project.optional-dependencies]
async = [
  "asyncpg>=0.30.0",
]
sync = [
  "psycopg[binary]>=3.2.3",
]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.7.4",
  "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brokerapp_db"]
