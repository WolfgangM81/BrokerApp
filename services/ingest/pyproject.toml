[project]
name = "brokerapp-ingest"
version = "0.1.0"
description = "BrokerApp market data ingestion worker (Celery)"
requires-python = ">=3.12,<3.13"
dependencies = [
  # Shared DB models (workspace member) — sync driver for the worker.
  "brokerapp-db[sync]",
  "celery[redis]>=5.4.0",
  "redis>=5.2.0",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  "structlog>=24.4.0",
  "exchange-calendars>=4.5.6",
  "yfinance>=0.2.48",
  "ccxt>=4.4.20",
  # DataFrame strategy (see ADR-0007):
  # - Polars is our primary DataFrame library.
  # - Pandas is pulled in transitively by yfinance/ccxt and used only at
  #   library boundaries; never as the canonical in-house format.
  "polars>=1.13.1",
  "pandas>=2.2.3",
  "pyarrow>=18.0.0",
  # Technical-analysis indicators (ADR-0007). Requires libta-lib-dev on
  # build hosts — see infra/docker/Dockerfile.worker.
  "ta-lib>=0.5.1",
  "httpx>=0.27.2",
]

[tool.uv.sources]
brokerapp-db = { workspace = true }

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.4",
  "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]
