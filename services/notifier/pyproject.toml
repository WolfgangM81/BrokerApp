[project]
name = "brokerapp-notifier"
version = "0.1.0"
description = "BrokerApp notification service (ntfy.sh push, placeholder)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27.2",
  "pydantic>=2.9.2",
  "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifier"]
