[project]
name = "brokerapp-notifier"
version = "0.1.0"
description = "BrokerApp notification service — ntfy.sh push for alerts"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27.2",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.7.4",
  "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifier"]
