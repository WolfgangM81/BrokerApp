[project]
name = "brokerapp-api"
version = "0.1.0"
description = "BrokerApp FastAPI gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
  # Shared DB models / Alembic migrations (workspace member).
  "brokerapp-db[async]",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  # ADR: asyncpg powers the runtime hot path; psycopg drives Alembic.
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.2.3",
  "structlog>=24.4.0",
  "python-json-logger>=2.0.7",
  "httpx>=0.27.2",
  "authlib>=1.3.2",
  "python-jose[cryptography]>=3.3.0",
  "prometheus-client>=0.21.0",
  "slowapi>=0.1.9",
  "redis>=5.2.0",
  "ulid-py>=1.1.0",
]

[tool.uv.sources]
brokerapp-db = { workspace = true }

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "pytest-postgresql>=6.1.1",
  "httpx>=0.27.2",
  "ruff>=0.7.4",
  "mypy>=1.13.0",
  "types-python-jose>=3.3.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers"]
